name: React CI

on:
  push:
    branches:
      - modernize-react-app
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test -- --watchAll=false
        env:
          CI: true